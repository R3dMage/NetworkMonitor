[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "network-history"
version = "0.1.0"
description = "Read-only router history collection with a persistent local web UI"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "paramiko>=4,<5", "waitress>=3,<4", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
network-history = "network_history.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
network_history = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
